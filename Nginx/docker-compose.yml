services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
    ports:
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
    volumes:
      - ./config/data:/data
      - ./config/letsencrypt:/etc/letsencrypt
      # Host trust store, so ACME requests and upstream HTTPS calls reject the
      # compromised eMudhra intermediates (CVE-2026-111943).
      # Both paths: the bundle is a symlink into the extracted dir, and OpenSSL
      # also reads the hashed per-certificate files in /etc/ssl/certs.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ca-certificates/extracted:/etc/ca-certificates/extracted:ro
