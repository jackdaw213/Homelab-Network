services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    network_mode: host 
    environment:
      - PUID=1000 
      - PGID=1000 
      - SUBDOMAINS=${HOST}
      - TOKEN=${TOKEN}
      - UPDATE_IP=ipv4 
      - LOG_FILE=false 
    volumes:
      - ./config:/config
      # Host trust store, so the DuckDNS API call rejects the compromised
      # eMudhra intermediates (CVE-2026-111943).
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped